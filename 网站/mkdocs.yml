# 站点配置：把三门课的笔记（ADS · 密码学基础 · 计算机系统 II）发布成一个静态网站。
#
# 页面内容来自仓库里各自的 `笔记/` 目录，由 prepare.py 汇集到 .docs/，
# 所以**不要直接改 .docs/ 里的文件**（每次构建都会被覆盖），要改就改原件。
#
# 构建：python 网站/build.py      （= prepare + mkdocs build + 链接自检）
# 预览：python 网站/build.py -s   （本地 http://127.0.0.1:8000）

site_name: 学习笔记
site_description: 浙江大学本科课程笔记 —— 高级数据结构与算法分析 · 密码学基础 · 计算机系统 II
site_url: https://nothing793.github.io/note/
repo_url: https://github.com/nothing793/note
repo_name: nothing793/note
copyright: 笔记由 AI 依据课程讲义整理，仅供个人学习；公式与结论以讲义和教材为准。

docs_dir: .docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

markdown_extensions:
  # 标题锚点必须与 GitHub / VS Code 预览一致，否则笔记里 480 余条
  # `其他笔记.md#小节` 链接会在站点上失效 —— 用 gh_slug.py 复刻 GitHub 的算法。
  - toc:
      permalink: true
      permalink_title: 复制本小节链接
      slugify: !!python/name:gh_slug.slugify
      toc_depth: 3
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - sane_lists
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  # 公式走 arithmatex 的 generic 模式，输出 \(...\) / \[...\]，由本地 MathJax 渲染
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - assets/mathjax-config.js
  - assets/vendor/mathjax/es5/tex-chtml.js

plugins:
  - search:
      lang:
        - zh
        - en

